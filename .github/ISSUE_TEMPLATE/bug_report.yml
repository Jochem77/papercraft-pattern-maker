name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Papercraft Pattern Maker! The more precise the report, the faster it can be fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots are very welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open model …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under Help → About.
      placeholder: 1.0.0-beta.1
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model and settings
      description: Which file type (STL/OBJ/GLB) and paper settings? If you can share the model or a saved project (.papercraft.json), please attach it (zip it if needed).
