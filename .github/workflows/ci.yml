name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: index.html is up to date with src/
        run: |
          node tools/build.js
          git diff --exit-code index.html || (echo "::error::index.html is out of date: run 'node tools/build.js' and commit the result" && exit 1)
